# DataHelix `ide` recipe — the development environment (platform ADR-0004).
#
# Multi-service compose (not a single container, per deployment-recipes.md
# decision 1.9): independent restarts, independent logs, and either component
# swappable to a live source checkout.
#
#   make up        # both from pinned images (known-good baseline)
#   make dev       # both from source, both live
#   make dev-web   # Aperture from source (HMR), Mosaic from image
#   make dev-api   # Mosaic from source, Aperture from image
#
# Profiles come in mutually exclusive pairs — <component>-image or
# <component>-source. The Makefile sets COMPOSE_PROFILES for you; running a
# raw `docker compose up` with no profile starts only the gateway, which is
# almost never what you want.
#
# NOT a deployment. `ide` is exempt from the ADR-0001 deploy gate precisely
# because it builds from source; nothing it produces is a certified artifact,
# and it must never serve real data. Use `solo` for that.

name: datahelix-ide

services:
  # ── Gateway: the single origin ─────────────────────────────────────────────
  # Routes exactly as `solo` does so browser muscle memory transfers, and so
  # the SPA keeps a *relative* /graphql endpoint — the same-origin seam means
  # no CORS configuration exists anywhere in the stack, in dev or in prod.
  gateway:
    image: nginx:1.27-alpine
    ports:
      - "${IDE_PORT:-8080}:8080"
    volumes:
      - ./gateway/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    environment:
      # Which upstream serves the app and the data plane. The Makefile sets
      # these to match the selected profiles; the template resolves them at
      # request time (see the resolver note in the template) so the gateway
      # starts even when only one pair is running.
      APERTURE_UPSTREAM: ${APERTURE_UPSTREAM:-aperture:80}
      MOSAIC_UPSTREAM: ${MOSAIC_UPSTREAM:-mosaic:8001}
      # Mosaic's bearer guard is a placeholder that only requires a non-empty
      # value (verification is Bridge's job later). Injected here so the
      # browser never handles a token.
      MOSAIC_TOKEN: ${MOSAIC_TOKEN:-ide}
    restart: unless-stopped

  # ── Mosaic: pinned image (default baseline) ────────────────────────────────
  mosaic:
    profiles: [mosaic-image]
    image: ghcr.io/datahelix-platform/mosaic:${MOSAIC_VERSION:-0.15.0}
    # The image's `mosaic` user is uid 999 with HOME=/project, but /project is a
    # bind mount owned by the host user — so it cannot write the SQLite file,
    # and PyStow (a transitive dep) fails at import trying to create its home.
    # `solo` sidesteps this by running as root; a dev recipe should not, or it
    # litters your checkout with root-owned files. Run as the invoking user
    # instead (the Makefile passes it) and give HOME a writable scratch path.
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    # --config explicitly: auto-discovery silently falls back to the bundled
    # default schema when it finds no config, which looks like "my schema
    # vanished" rather than an error.
    command:
      ["serve", "--graphql", "--mcp", "--host", "0.0.0.0", "--port", "8001",
       "--config", "/project/mosaic.yaml"]
    environment:
      HOME: /tmp
      # Empty unless a planner profile is on (the Makefile's chat targets set
      # it). Mosaic registers `converseQuerySpec` ONLY when this is set, so
      # leaving it unset is what keeps Aperture's chat panel correctly hidden
      # on a stack with no planner -- rather than advertising a capability
      # whose every call would fail.
      MOSAIC_EXON_URL: ${MOSAIC_EXON_URL:-}
      # The MCP transport allows only loopback Host headers by default, so a
      # sibling container reaching http://mosaic:8001/mcp is refused with
      # `421 Invalid Host header` (datahelix-platform/mosaic#214). Loopback stays
      # allowed; these are added to it.
      #
      # Needs mosaic >= 0.14.0, which the pinned default is: 0.13.0 had neither
      # the `--mcp` flag nor a host allow-list. Both shipped in 0.14.0 along
      # with the `mcp` extra being installed in the image, so `make chat`
      # against the pinned image works and the first-run pip install this
      # recipe used to do for `mosaic-dev` is gone.
      MOSAIC_MCP_ALLOWED_HOSTS: ${MOSAIC_MCP_ALLOWED_HOSTS:-mosaic:*,mosaic-dev:*}
    volumes:
      - "${PROJECT_DIR:-./project}:/project"
    restart: unless-stopped

  # ── Mosaic: live from source ───────────────────────────────────────────────
  # Same image (so every runtime dependency is already installed), with the
  # source checkout mounted and PYTHONPATH shadowing the installed package.
  # Verified: `import mosaic` resolves to /src/mosaic/__init__.py, not the
  # image's site-packages.
  #
  # `--reload` watches the mounted checkout, not cwd. Two upstream fixes were
  # needed to get here: datahelix-platform/mosaic#171 (the flag used to exit(1),
  # because serve handed uvicorn an app object instead of an import string)
  # and #174 (uvicorn then defaulted its watch dir to cwd, which must stay
  # /project so mosaic.yaml's schema_path/database_url keep resolving — so the
  # reloader watched a tree with no *.py in it and silently never fired).
  #
  # --reload-dir is passed explicitly even though mosaic now defaults it to the
  # resolved `mosaic` package directory (which is /src/mosaic here): being
  # explicit means this keeps working if PYTHONPATH or the mount path changes.
  #
  # NOT available on the `mosaic` (image) profile: the fixes postdate v0.13.0
  # and no image has shipped with them. This profile is unaffected because
  # PYTHONPATH=/src shadows the CLI too, so `mosaic serve` runs from the
  # submodule rather than the image.
  mosaic-dev:
    profiles: [mosaic-source]
    image: ghcr.io/datahelix-platform/mosaic:${MOSAIC_VERSION:-0.15.0}
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    command:
      ["serve", "--graphql", "--mcp", "--host", "0.0.0.0", "--port", "8001",
       "--config", "/project/mosaic.yaml", "--reload", "--reload-dir", "/src"]
    environment:
      PYTHONPATH: /src
      # See the note on the `mosaic` service above.
      HOME: /tmp
      MOSAIC_EXON_URL: ${MOSAIC_EXON_URL:-}
      MOSAIC_MCP_ALLOWED_HOSTS: ${MOSAIC_MCP_ALLOWED_HOSTS:-mosaic:*,mosaic-dev:*}
    volumes:
      - "${PROJECT_DIR:-./project}:/project"
      - "${MOSAIC_SRC:-../../../mosaic/src}:/src:ro"
    restart: unless-stopped

  # ── Aperture: published image (default baseline) ───────────────────────────
  # The image injects its runtime config at start from VITE_* env (ADR-0034).
  aperture:
    profiles: [aperture-image]
    image: ghcr.io/bu-neuromics/aperture:${APERTURE_VERSION:-0.7.1}
    environment:
      VITE_HIPPO_GRAPHQL_URL: ${VITE_HIPPO_GRAPHQL_URL:-/graphql}
      VITE_HIPPO_CONTROL_PLANE_URL: ${VITE_HIPPO_CONTROL_PLANE_URL:-}
      VITE_WORKFLOWS: ${VITE_WORKFLOWS:-}
      VITE_NAV: ${VITE_NAV:-}
    restart: unless-stopped

  # ── Aperture: live from source, Vite dev server with HMR ───────────────────
  # This service is the substance of ADR-0004's amendment to decision 1.9,
  # which had Aperture as a published image only.
  #
  # Vite listens on IDE_PORT — the same port the browser talks to — so its HMR
  # client's default port assumption matches the public origin and no
  # `hmr.clientPort` override is needed. Change IDE_PORT and both follow.
  #
  # node_modules lives in a named volume rather than coming from the host, so
  # no host Node toolchain is involved at all. That is deliberate: an
  # unpinned host toolchain is what produced the incident behind ADR-0004.
  aperture-dev:
    profiles: [aperture-source]
    image: node:${NODE_VERSION:-26}
    working_dir: /app
    command:
      - sh
      - -lc
      - |
        if [ ! -x node_modules/.bin/vite ]; then
          echo "ide: installing dependencies (first run; cached in a named volume)"
          npm ci --no-audit --no-fund
        fi
        exec node_modules/.bin/vite --host 0.0.0.0 --port "${IDE_PORT:-8080}"
    environment:
      # Relative endpoint: the browser resolves it against the gateway origin,
      # so dev exercises the production same-origin arrangement.
      VITE_HIPPO_GRAPHQL_URL: ${VITE_HIPPO_GRAPHQL_URL:-/graphql}
      IDE_PORT: ${IDE_PORT:-8080}
    volumes:
      - "${APERTURE_WEB:-../../../aperture/web}:/app"
      - aperture-node-modules:/app/node_modules
    restart: unless-stopped

  # ── Reel: the planning service Mosaic's relay delegates to ─────────────────
  # OPT-IN. Neither `up` nor `dev` starts it; the Makefile's chat targets do.
  # Without it Mosaic leaves MOSAIC_EXON_URL unset, never registers
  # `converseQuerySpec`, and Aperture correctly hides its chat panel -- the
  # stack is still a complete browsing environment, just not a conversational
  # one.
  #
  # Reel plans and never executes (Reel ADR-0007): Mosaic re-validates every
  # QuerySpec it returns before any caller sees it, and nothing runs without an
  # explicit user action. It is reached only by Mosaic, container-internal, so
  # it publishes no port and needs no gateway route.
  #
  # NO `depends_on`. It would have to name `mosaic` or `mosaic-dev` depending on
  # which profile is active, and compose rejects a dependency on a service whose
  # profile is not enabled -- which breaks every plain `docker compose` command
  # run without COMPOSE_PROFILES set, `make restart-planner` included.
  #
  # The planner fetches its grounding ONCE at startup and exits 3 if Mosaic is
  # not reachable, so on a cold start it loses the race and restarts until
  # Mosaic is listening. `restart: unless-stopped` is what resolves it; one or
  # two restarts on first run are expected, and the log says exactly what it is
  # waiting for.
  #
  # It needs MODEL CREDENTIALS. The default passes an AWS profile through from
  # the host for Bedrock; set REEL_MODEL and the matching provider key for
  # anything else. Reel holds no credentials of its own and neither does
  # Mosaic -- this is the only service in the stack that talks to a model.
  reel:
    profiles: [reel-image]
    image: ghcr.io/bu-neuromics/reel:${REEL_VERSION:-0.1.0}
    environment:
      MOSAIC_MCP_URL: ${MOSAIC_MCP_URL:-http://mosaic:8001/mcp}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      # LIST form, not map form, for everything optional. `KEY: ${KEY:-}` SETS
      # the variable to an empty string, which is not the same as leaving it
      # unset: boto3 reads AWS_PROFILE="" as a profile literally named empty and
      # fails to find credentials, and an empty REEL_MODEL reaches litellm as
      # "no provider given". The list form passes a variable through only when
      # it is actually set in the invoking environment.
      REEL_MODEL:
      AWS_PROFILE:
      ANTHROPIC_API_KEY:
      OPENAI_API_KEY:
    volumes:
      - "${AWS_DIR:-~/.aws}:/home/reel/.aws:ro"
    restart: unless-stopped

  # ── Reel: live from source ─────────────────────────────────────────────────
  # Same image (every runtime dependency is already installed), with the
  # checkout mounted and PYTHONPATH shadowing the installed package -- exactly
  # the arrangement `mosaic-dev` uses. No --reload: the service fetches its
  # capability grounding once at startup, so a reload would re-fetch on every
  # edit; `make restart-planner` is the deliberate way to pick up changes.
  reel-dev:
    profiles: [reel-source]
    image: ghcr.io/bu-neuromics/reel:${REEL_VERSION:-0.1.0}
    environment:
      PYTHONPATH: /src
      # `mosaic-dev`, not `mosaic`: the source profile is a different service
      # and compose service names are the DNS names on the network. Pointing
      # this at `mosaic` yields "Name or service not known" and a planner that
      # restarts forever.
      MOSAIC_MCP_URL: ${MOSAIC_MCP_URL:-http://mosaic-dev:8001/mcp}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      # LIST form, not map form, for everything optional. `KEY: ${KEY:-}` SETS
      # the variable to an empty string, which is not the same as leaving it
      # unset: boto3 reads AWS_PROFILE="" as a profile literally named empty and
      # fails to find credentials, and an empty REEL_MODEL reaches litellm as
      # "no provider given". The list form passes a variable through only when
      # it is actually set in the invoking environment.
      REEL_MODEL:
      AWS_PROFILE:
      ANTHROPIC_API_KEY:
      OPENAI_API_KEY:
    volumes:
      - "${REEL_SRC:-../../../reel/src}:/src:ro"
      - "${AWS_DIR:-~/.aws}:/home/reel/.aws:ro"
    restart: unless-stopped

volumes:
  # Kept out of the bind mount so container installs never collide with a
  # host-side node_modules (different libc, different Node).
  aperture-node-modules:
