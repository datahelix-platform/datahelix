id: https://w3id.org/datahelix/certification/portal_schema
name: datahelix_certification_portal
title: DataHelix certification — portal domain fixture
description: >-
  The domain schema the composition-certification golden path drives. It is a
  deliberately generic library-catalog (Book / Author / Review) — no DataHelix
  deployment nouns — chosen to exercise every capability Aperture's SPA derives
  from Mosaic's autogenerated GraphQL transport (formerly Hippo, ADR-0004;
  platform ADR-0001; mirrors the shape in Aperture web/src/data/testing/fixtures.ts
  capableSchema()):

    - a collection list field with equality filters (enum / boolean / ref)   → browse/filter loop
    - a scalar/ref-typed create + update surface                              → single-entity write loop
    - referenced relationships for intra-batch reference resolution           → atomic multi-entity workflow loop
    - full-text search + history                                              → (nightly) deeper coverage
    - a stored multivalued forward reference (Book.co_authors)                → to-many traversal/explode (Aperture ADR-0041)
    - an `inverse:`-declared reverse edge (Author.books)                       → reverse-edge traversal (mosaic ADR-0011)
    - an inlined value object (Book.dimensions → Dimensions)                   → structured-value display + export (aperture#82)

  Kept intentionally small: three domain classes, one inlined value type
  (Dimensions), plus the control-plane document recipe
  (aperture_control_plane.yaml). Authored in LinkML because
  Mosaic *becomes* the schema it is given (config-driven relational, graph-shaped
  API); Mosaic autogenerates the GraphQL types, filters, and create/update/batch
  mutations from these classes at `serve` time.

prefixes:
  linkml: https://w3id.org/linkml/

imports:
  - linkml:types
  - mosaic_core

default_range: string

enums:

  BookFormat:
    description: Physical/digital form of a Book — drives an enum facet in browse/filter.
    permissible_values:
      hardcover:
      paperback:
      ebook:
      audiobook:

classes:

  Author:
    is_a: Entity
    description: >-
      A person who writes Books. `name` is full-text searchable; the write loop
      creates an Author, and the atomic-workflow loop creates an Author and its
      Books in one batch (intra-batch reference: the Book's `author` points at
      the not-yet-committed Author by its batch ref).
    attributes:
      name:
        range: string
        required: true
        annotations:
          mosaic_search: fts5
      bio:
        range: string
      books:
        range: Book
        multivalued: true
        inverse: author  # virtual reverse edge (mosaic ADR-0011) — no code, schema-only
        description: >-
          Reverse edge to every Book whose `author` points at this Author.
          Declared so reverse-edge traversal (Aperture ADR-0041) is certifiable;
          derived entirely from Book.author, never stored.

  Book:
    is_a: Entity
    description: >-
      A published work. `format` (enum) and `in_print` (boolean) drive facets;
      `author` is a typed reference used for cross-links and batch resolution.
    attributes:
      title:
        range: string
        required: true
        annotations:
          mosaic_search: fts5
      author:
        range: Author
        required: true
        description: The Book's author (typed reference → cross-link + batch resolution).
        annotations:
          mosaic_index: true
      co_authors:
        range: Author
        multivalued: true
        description: >-
          Other Authors credited alongside `author` (a real stored to-many
          reference, not derived). Exercises forward to-many traversal/explode
          (Aperture ADR-0041) — distinct from the `books` reverse edge, which
          is derived rather than stored.
      format:
        range: BookFormat
        description: Enum facet in the browse/filter loop.
      in_print:
        range: boolean
        ifabsent: "true"
        description: Boolean facet in the browse/filter loop.
      year:
        range: integer
      dimensions:
        range: Dimensions
        inlined: true
        description: >-
          The catalogued physical size of the Book — an inlined value object,
          not an entity (no identity, no lifecycle). Mosaic passes it through as a
          structured value, so it certifies that the result table and every
          export read it as text, never "[object Object]" (aperture#82).

  Dimensions:
    description: >-
      Height and width of a Book as catalogued, in centimetres. A value type: it is
      embedded in its Book (`inlined: true`), so it is neither a collection nor
      a reference target.
    attributes:
      height_cm:
        range: float
      width_cm:
        range: float

  Review:
    is_a: Entity
    description: >-
      A review of a Book. Third entity in the atomic-workflow batch (Author →
      Book → Review), so the golden path stages a three-node linked set and
      commits it all-or-nothing.
    attributes:
      book:
        range: Book
        required: true
        annotations:
          mosaic_index: true
      rating:
        range: integer
        required: true
        description: 1–5 stars.
      body:
        range: string
        annotations:
          mosaic_search: fts5
