# Solo recipe smoke: build the single-container bundle from the certified
# pair and drive the whole loop headlessly — boot, browse, edit schema,
# migrate-on-restart, verify. This job is the §4.4 middle-path seed: it is
# designed to be promoted into the certification harness (with a ledger
# `bundle` artifact kind) once the recipe stabilizes.
# See proposals/deployment-recipes.md and deploy/recipes/solo/README.md.

name: Solo recipe

on:
  pull_request:
    paths:
      - "deploy/recipes/solo/**"
      - ".github/workflows/solo-recipe.yml"
  push:
    branches: [main]
    paths:
      - "deploy/recipes/solo/**"
      - ".github/workflows/solo-recipe.yml"
  # Nightly boot smoke so config/runtime drift is caught even when no recipe
  # file changed (e.g. a Mosaic submodule bump or a component config-contract
  # change). The legacy root docker-compose tier rotted precisely because
  # nothing booted it; the packaged recipe that replaced it does not get to.
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read   # checkout only; the smoke job builds and runs locally

jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/recipes/solo
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # ledger gate reads certified/* tag history
          fetch-tags: true

      - name: Pins match the certified lock (recipe invariant)
        run: make check-pins

      - name: Certification status (informational — ADR-0001 deploy gate)
        # The ledger gate is the operator's DEPLOY-time pre-flight; whether
        # this exact pair is certified right now is ledger state maintained by
        # the certify workflow, independent of whether the recipe builds and
        # works. Surface it here without failing the recipe smoke.
        continue-on-error: true
        run: make gate

      - name: Scaffold example project
        run: make init

      - name: Build and start the bundle
        # Publish Mosaic's raw port too (the commented "8001:8001" line in
        # docker-compose.yml) so the bind-host smoke below can reach it. An
        # override file is picked up by every later `docker compose` call.
        run: |
          cat > docker-compose.override.yml <<'EOF'
          services:
            solo:
              ports:
                - "8001:8001"
          EOF
          docker compose up -d --build

      - name: Wait for health (nginx -> mosaic seam)
        run: |
          timeout 180 sh -c 'until curl -sf http://localhost:8080/health; do
            sleep 3
          done'
          echo
          docker compose logs solo | grep "solo:"

      - name: "Smoke: AUTH_MODE=none binds Mosaic on 0.0.0.0 (published 8001 answers)"
        # Mosaic's bind host follows AUTH_MODE (entrypoint.sh): none → 0.0.0.0,
        # so a published 8001 must answer from outside the container. Before
        # this was derived, supervisord hard-coded 127.0.0.1 and it could not.
        # The log line only records the entrypoint's choice (it is printed
        # before Mosaic starts); the curl is what proves the bind.
        run: |
          docker compose logs solo | grep -q "binding Mosaic to 0.0.0.0:8001"
          curl -sf http://localhost:8001/health
          echo
          echo "8001 reachable from the host with AUTH_MODE=none"

      - name: "Smoke: SPA shell and runtime config"
        run: |
          curl -sf http://localhost:8080/ | grep -qi "<!doctype html>"
          curl -sf http://localhost:8080/config.js | grep -q '"/graphql"'
          echo "aperture shell served; runtime config injected"

      - name: "Smoke: GraphQL introspection through the same-origin seam"
        # Deliberately no Authorization header — proves the nginx bearer
        # injection works, exactly as the browser will call it.
        run: |
          curl -sf -X POST http://localhost:8080/graphql \
            -H 'Content-Type: application/json' \
            -d '{"query":"{ __schema { types { name } } }"}' \
          | python3 -c "
          import json, sys
          names = [t['name'] for t in json.load(sys.stdin)['data']['__schema']['types']]
          assert 'Project' in names and 'Note' in names, names
          print(f'introspection ok: {len(names)} types, Project + Note present')
          "

      - name: "Schema iteration: add a class, make migrate, verify"
        # schema_path is a directory — every *.yaml merges into one registry,
        # so schema iteration can be a dropped-in file (cross-file references
        # like range: Project resolve across the merge).
        run: |
          cat > project/schemas/iteration2.yaml <<'EOF'
          id: https://example.org/solo-example-iteration2
          name: solo_example_iteration2
          prefixes:
            linkml: https://w3id.org/linkml/
            solo_example_iteration2: https://example.org/solo-example-iteration2/
          imports:
            - linkml:types
          default_range: string

          classes:
            Milestone:
              description: "A dated milestone (added by the smoke test)"
              attributes:
                milestone_id:
                  range: string
                  required: true
                  identifier: true
                project:
                  range: Project
                due_date:
                  range: date
          EOF
          make migrate
          timeout 180 sh -c 'until curl -sf http://localhost:8080/health; do
            sleep 3
          done'
          docker compose logs solo | grep -q "applying schema migrations"
          curl -sf -X POST http://localhost:8080/graphql \
            -H 'Content-Type: application/json' \
            -d '{"query":"{ __schema { types { name } } }"}' \
          | python3 -c "
          import json, sys
          names = [t['name'] for t in json.load(sys.stdin)['data']['__schema']['types']]
          assert 'Milestone' in names, names
          print('migrate-on-restart ok: Milestone visible via GraphQL')
          "

      - name: "Regression: migrate resolves local cross-file schema imports"
        # Covers the bug fixed in #68: `mosaic migrate` resolves a schema's
        # relative sibling `imports:` against the process cwd, not
        # --schema-dir, so entrypoint.sh runs it with cwd = the schema dir.
        # The example project above has a directory schema_path with no
        # cross-file imports, so it cannot catch this — this fixture's
        # tree-root file (main.yaml) imports a sibling (extra.yaml) in the
        # same schemas/ directory, as a real split LinkML schema would.
        run: |
          docker compose down
          FIXTURE="$(pwd)/.ci-fixtures/multi-file-imports"
          # The container runs as root, so the db it writes is root-owned.
          sudo rm -f "$FIXTURE"/data/mosaic.db*

          # First boot: no db yet, so `mosaic serve` self-initializes it.
          PROJECT_DIR="$FIXTURE" docker compose up -d
          timeout 180 sh -c 'until curl -sf http://localhost:8080/health; do
            sleep 3
          done'
          docker compose logs solo | grep -q "first boot"
          curl -sf -X POST http://localhost:8080/graphql \
            -H 'Content-Type: application/json' \
            -d '{"query":"{ __schema { types { name } } }"}' \
          | python3 -c "
          import json, sys
          names = [t['name'] for t in json.load(sys.stdin)['data']['__schema']['types']]
          assert 'Widget' in names and 'Gadget' in names, names
          print('first boot ok: Widget + Gadget present (cross-file imports resolved)')
          "

          # Restart (= what `make migrate` does): the db now exists, so this
          # takes the migrate path the fix addresses. Before the fix it
          # crash-looped with a FileNotFoundError instead of reaching
          # "applying schema migrations". `up -d` would be a no-op here — the
          # container is already running with an unchanged config.
          PROJECT_DIR="$FIXTURE" docker compose restart solo
          timeout 180 sh -c 'until curl -sf http://localhost:8080/health; do
            sleep 3
          done'
          # Only the restart can emit this; the first boot logged "first boot".
          docker compose logs solo | grep -q "applying schema migrations"
          curl -sf -X POST http://localhost:8080/graphql \
            -H 'Content-Type: application/json' \
            -d '{"query":"{ __schema { types { name } } }"}' \
          | python3 -c "
          import json, sys
          names = [t['name'] for t in json.load(sys.stdin)['data']['__schema']['types']]
          assert 'Widget' in names and 'Gadget' in names, names
          print('second boot ok: Widget + Gadget still present after migrate')
          "

      - name: "Smoke: auth on keeps Mosaic on 127.0.0.1; ::1 is refused"
        # With AUTH_MODE=htpasswd, 8001 is outside the auth boundary, so the
        # default bind is loopback: the published 8001 must NOT answer, while
        # nginx (which proxies to 127.0.0.1:8001) still does. A regression to
        # 0.0.0.0 with auth on would fail here. /health is auth-exempt in
        # nginx-auth.conf, so no session is needed.
        run: |
          docker compose down
          mkdir -p .ci-auth
          docker run --rm httpd:2.4-alpine htpasswd -nbB ci ci-password > .ci-auth/users.htpasswd
          export AUTH_DIR="$(pwd)/.ci-auth" AUTH_MODE=htpasswd AUTH_COOKIE_SECURE=false
          AUTH_COOKIE_SECRET="$(openssl rand -base64 32 | tr -- '+/' '-_')"
          export AUTH_COOKIE_SECRET
          docker compose up -d
          timeout 180 sh -c 'until curl -sf http://localhost:8080/health; do
            sleep 3
          done'
          echo
          docker compose logs solo | grep -q "binding Mosaic to 127.0.0.1:8001"
          if curl -sf --max-time 5 http://localhost:8001/health; then
            echo "8001 answered with AUTH_MODE=htpasswd — Mosaic is not on loopback" >&2
            exit 1
          fi
          echo "auth on: 8001 closed from the host, :8080/health answers via nginx"

          # ::1 would bind IPv6-only while nginx proxies to 127.0.0.1, so the
          # entrypoint must refuse it rather than boot a bundle that 502s.
          if out=$(docker compose run --rm --no-deps -T -e MOSAIC_BIND_HOST=::1 solo 2>&1); then
            echo "MOSAIC_BIND_HOST=::1 was accepted" >&2; exit 1
          fi
          echo "$out" | grep -q "MOSAIC_BIND_HOST=::1 binds IPv6 only"
          echo "::1 refused at startup"
          docker compose down

      - name: Clean up the regression fixture
        if: always()
        run: |
          docker compose down || true
          sudo rm -f .ci-fixtures/multi-file-imports/data/mosaic.db*

      - name: Logs on failure
        if: failure()
        run: docker compose logs solo || true
